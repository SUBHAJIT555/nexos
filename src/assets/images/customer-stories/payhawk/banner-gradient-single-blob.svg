<?xml version="1.0" encoding="UTF-8"?>
<svg width="1180" height="600" viewBox="0 0 1180 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#9C5FFF"/>
      <stop offset="100%" stop-color="#3C0095"/>
    </radialGradient>
    <filter id="blurHeavy" x="-60%" y="-60%" width="620%" height="620%">
      <feGaussianBlur stdDeviation="100" />
    </filter>
  </defs>
  <rect width="1180" height="600" fill="#071013"/>
  <!-- One blob, bottom edge, only upper half visible -->
  <circle fill="url(#g1)" opacity="0.86" filter="url(#blurHeavy)">
    <!-- center x = middle, center y = just off bottom -->
    <animate attributeName="cx" values="590;540;640;590" keyTimes="0;0.33;0.66;1" dur="12.24s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="620;600;590;620" keyTimes="0;0.33;0.66;1" dur="9.36s" repeatCount="indefinite"/>
    <animate attributeName="r"  values="250;380;310;250;250" keyTimes="0;0.3;0.6;0.9;1" dur="7.2s" repeatCount="indefinite"/>
  </circle>
</svg>
