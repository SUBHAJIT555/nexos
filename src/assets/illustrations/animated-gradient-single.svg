<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="400" viewBox="0 0 1440 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#9C5FFF"/>
      <stop offset="100%" stop-color="#3C0095"/>
    </radialGradient>
    <filter id="blurHeavy" x="-200%" y="-200%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="100" />
    </filter>
  </defs>
  <rect width="1440" height="400" fill="#071013"/>
  <!-- Centered squished blob, bottom edge, only upper half visible -->
  <ellipse fill="url(#g1)" opacity="0.86" filter="url(#blurHeavy)">
    <animate attributeName="cx" values="720;670;770;720" keyTimes="0;0.33;0.66;1" dur="10.65s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="420;400;390;420" keyTimes="0;0.33;0.66;1" dur="8.14s" repeatCount="indefinite"/>
    <!-- More dramatic pulse at start of animation -->
    <animate attributeName="rx" values="510;380;470;410;510" keyTimes="0;0.2;0.5;0.85;1" dur="6.26s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="145;90;145;110;145" keyTimes="0;0.2;0.5;0.85;1" dur="6.26s" repeatCount="indefinite"/>
  </ellipse>
</svg>
